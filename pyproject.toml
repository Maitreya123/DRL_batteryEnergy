[project]
name = "battery-rl"
version = "0.1.0"
description = "Constrained deep RL for home battery control under ERCOT real-time prices (CSCE-642 project)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scipy>=1.13",
    "pvlib>=0.11",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_rl"]
